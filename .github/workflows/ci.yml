name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-mock-aot:
    name: macOS · mock tests, UI and NativeAOT
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EGRESS_MOCK_ONLY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify managed architecture, pure C ABI, mock interactions and NativeAOT package
        run: python3 build/Verify-Mac.py
      - name: Upload rendered states and interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Egress-macOS-ui
          path: artifacts/mac-ui/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified Apple Silicon preview
        uses: actions/upload-artifact@v7
        with:
          name: Egress-osx-arm64
          path: |
            artifacts/package/EgressController-osx-arm64.zip
            artifacts/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
