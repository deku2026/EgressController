name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  macos-preview:
    name: Verify and package macOS preview
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EGRESS_MOCK_ONLY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run the complete mock acceptance and NativeAOT build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 build/Verify-Mac.py --version "${GITHUB_REF_NAME#v}"
          else
            python3 build/Verify-Mac.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Egress-osx-arm64-preview
          path: artifacts/package/*
          if-no-files-found: error
      - name: Publish existing version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          artifacts/package/EgressController-osx-arm64.zip artifacts/package/SHA256SUMS.txt
          --verify-tag --generate-notes --title "Egress macOS preview $RELEASE_TAG"
          --notes "Isolated macOS preview with an ad-hoc signed NativeAOT app. No privileged helper or live TUN takeover is enabled."
