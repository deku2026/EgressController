name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish win-x64 release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:\.\d+)?)$') {
            throw "Release tag '$tag' must look like v1.2.3."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore EgressController.slnx

      - name: Build
        run: dotnet build EgressController.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: ./build/Invoke-Tests.ps1 -Configuration Release -NoBuild

      - name: Prepare optional signing certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            'enabled=false' >> $env:GITHUB_OUTPUT
            'certificate_path=' >> $env:GITHUB_OUTPUT
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'egress-controller-signing.pfx'
          $bytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certificatePath, $bytes)
          'enabled=true' >> $env:GITHUB_OUTPUT
          "certificate_path=$certificatePath" >> $env:GITHUB_OUTPUT

      - name: Create release artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $arguments = @('-Version', '${{ steps.version.outputs.version }}')
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            $arguments += @('-CertificatePath', '${{ steps.signing.outputs.certificate_path }}')
          }
          ./build/Package.ps1 @arguments

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.signing.outputs.certificate_path }}' -Force -ErrorAction SilentlyContinue

      - name: Summarize signing mode
        shell: pwsh
        run: |
          if ('${{ steps.signing.outputs.enabled }}' -eq 'true') {
            '### Signed MSIX release' >> $env:GITHUB_STEP_SUMMARY
            'The release includes a signed MSIX and App Installer update feed.' >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            '### Portable/unsigned release' >> $env:GITHUB_STEP_SUMMARY
            'Signing secrets were not configured. The NativeAOT ZIP is usable; the MSIX is explicitly marked unsigned.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem -LiteralPath artifacts/package -File | Sort-Object Name | ForEach-Object FullName
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Updating release assets failed.' }
          }
          else {
            gh release create $tag @files --verify-tag --generate-notes --title "EgressController $tag"
            if ($LASTEXITCODE -ne 0) { throw 'Creating the GitHub Release failed.' }
          }
