name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  macos-preview:
    name: Verify and package macOS client
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EGRESS_MOCK_ONLY: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      # Build-time dependency acquisition only. Product startup never downloads its own bootstrap core.
      - name: Acquire pinned offline Xray package payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/core
          gh release download v26.10.29 --repo XTLS/Xray-core --pattern Xray-macos-arm64-v8a.zip --dir artifacts/core
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run the complete mock acceptance and NativeAOT build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 build/Verify-Mac.py --version "${GITHUB_REF_NAME#v}"
          else
            python3 build/Verify-Mac.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Egress-osx-arm64
          path: artifacts/package/*
          if-no-files-found: error
      - name: Publish existing version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          artifacts/package/EgressController-osx-arm64.zip artifacts/package/SHA256SUMS.txt
          --verify-tag --generate-notes --title "Egress macOS $RELEASE_TAG"
          --notes "Ad-hoc signed NativeAOT app and privileged helper. Default production startup; explicit --preview for isolated UI. Automated verification uses mocks only; live network acceptance must be performed separately."
